<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Pulse</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Project Pulse</h1>
  </header>
  <main>
    <div class="dashboard" id="projects-grid">
      <!-- Loading indicator or placeholder -->
      <div style="grid-column: 1 / -1; text-align: center; padding: 3rem; color: var(--text-muted);">
        <p>Loading projects...</p>
      </div>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const grid = document.getElementById('projects-grid');

      fetch('project-data.json')
        .then(response => {
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          return response.json();
        })
        .then(data => {
          if (!data || !Array.isArray(data.projects)) {
            throw new Error('Invalid project data format');
          }

          grid.innerHTML = ''; // Clear loading placeholder

          data.projects.forEach(project => {
            const card = document.createElement('article');
            card.className = 'project-card';

            const statusClass = `status-${project.status.toLowerCase()}`;
            const priorityClass = `priority-${project.priority.toLowerCase()}`;

            card.innerHTML = `
              <h2 class="project-title">${escapeHTML(project.name)}</h2>
              <div class="project-meta">
                <span class="project-owner">Owner: <strong>${escapeHTML(project.owner)}</strong></span>
                <span class="project-dates">Updated Recently</span>
              </div>
              <p class="project-description">${escapeHTML(project.recentActivity)}</p>
              <div class="tags">
                <span class="badge ${statusClass}">${escapeHTML(project.status)}</span>
                <span class="badge ${priorityClass}">${escapeHTML(project.priority)}</span>
              </div>
              <div class="project-actions">
                <button class="btn">View Details</button>
              </div>
            `;
            grid.appendChild(card);
          });
        })
        .catch(error => {
          console.error('Error fetching project data:', error);
          grid.innerHTML = `
            <div class="error-message" style="grid-column: 1 / -1; padding: 2rem; background-color: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; border-radius: var(--radius-md); text-align: center;">
              <h3>Unable to load projects</h3>
              <p>We're having trouble retrieving the project data right now. Please try again later.</p>
              <p style="font-size: 0.85rem; margin-top: 0.5rem; opacity: 0.8;">Details: ${escapeHTML(error.message)}</p>
            </div>
          `;
        });
    });

    function escapeHTML(str) {
      if (!str) return '';
      return str.replace(/[&<>'"]/g, 
        tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
      );
    }
  </script>
</body>
</html>
